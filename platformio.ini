; PlatformIO Project Configuration File
; OV7670 camera on YD-RP2040 (VCC-GND) - simplest implementation
; maxgerhardt fork: 'arduino' framework = arduino-pico core (earlephilhower),
; exposes pico-sdk PIO/DMA + Wire pin remap. Required for camera capture.

[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = vccgnd_yd_rp2040
framework = arduino
monitor_speed = 115200

; Native USB CDC console on the board's USB port (GP0/GP1 free for camera).
; USB_MODE=1 + CDC_ON_BOOT=1: Serial = USB CDC, no UART pins needed.
; XCLK_PWM: GP22 driven by hardware PWM at 20.83 MHz (kept under the 24 MHz
; XCLK spec; the 25 MHz PWM build stalled the sensor FSM - see main.cpp).
;
; RAW_BAYER: sensor raw 8-bit Bayer out (COM7=0x01) + 'T' half-window switch.
;
; Experimental build flags (T7 PCLK-per-line investigation, exp/raw-bayer):
;   -DRAW_BAYER_PER_PCLK
;     Capture samples EVERY PCLK rising edge (official Table 3-3 raw timing
;     model, 1 byte/PCLK) instead of the shipped every-2nd-PCLK workaround.
;     Used by the official-config A/B (8th group): with per-PCLK sampling,
;     dup_even==1.000 reproduces the raw-mode byte duplication; if the
;     official Table 2-2 registers make the sensor emit one distinct byte
;     per PCLK, dup_even drops below 1. Pair with -DRAW_BAYER_OFFICIAL_REGS
;     for group B. Never ship together with the default (every-2nd-PCLK)
;     capture: the two programs are alternative raw-mode capture paths.
;   -DRAW_BAYER_OFFICIAL_REGS
;     Use the datasheet Table 2-2 Sheet 3 raw register set verbatim
;     (CLKRC=0x01, COM14=0x00, XSC=0x3A, YSC=0x35, DCWCTR=0x11,
;     PCLK_DIV=0xF0, PCLK_DELAY=0x02) instead of the pinned shipped table.
;     Group B of the 8th A/B: does the official config fix the 2-PCLK hold?
;     test_hw_bayer.py detects it via CLKRC readback (0x01 = official) and
;     switches EXPECTED_REGS automatically.
;
; Diagnostic 'C' command (firmware always enabled): per-HREF-line PCLK rising
; edge counter on PIO SM2. Reply: DBG1 + 0xF8 + nlines + nlines*(u32 BE
; remaining countdown). Host: edges = 0xFFFFFFFF - val -> 640 (official
; Table 3-3 timing) or 1280 (each byte held 2 PCLKs) per line.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=640
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER

; 8th-group A/B (exp/raw-bayer): official Table 2-2 Sheet 3 registers +
; per-PCLK sampling. Build B of the A/B: does the official config make the
; sensor emit one distinct byte per PCLK (dup_even < 1) or reproduce the
; 2-PCLK hold (dup_even still 1.000)? 'C' counts edges/line directly
; (640 vs 1280) regardless of the sampling program.
[env:rpipico_official]
platform = ${env:rpipico.platform}
board = ${env:rpipico.board}
framework = ${env:rpipico.framework}
monitor_speed = ${env:rpipico.monitor_speed}
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=640
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER
  -DRAW_BAYER_PER_PCLK
  -DRAW_BAYER_OFFICIAL_REGS
