; PlatformIO Project Configuration File
; OV7670 camera on YD-RP2040 (VCC-GND) - simplest implementation
; maxgerhardt fork: 'arduino' framework = arduino-pico core (earlephilhower),
; exposes pico-sdk PIO/DMA + Wire pin remap. Required for camera capture.

[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = vccgnd_yd_rp2040
framework = arduino
monitor_speed = 115200

; Native USB CDC console on the board's USB port (GP0/GP1 free for camera).
; USB_MODE=1 + CDC_ON_BOOT=1: Serial = USB CDC, no UART pins needed.
; XCLK_PWM: GP22 driven by hardware PWM at 20.83 MHz (kept under the 24 MHz
; XCLK spec; the 25 MHz PWM build stalled the sensor FSM - see main.cpp).
;
; RAW_BAYER: sensor raw 8-bit Bayer out (COM7=0x01) + 'T' half-window switch.
;
; Default build (320×240): official Table 2-2 registers + per-PCLK sampling.
;   DCWCTR=0x11 applies HDS×2 downsampling → 320 distinct bytes/line matches
;   FRAME_W=320. PCLK_DIV=0xF0 enables divider → 640 PCLKs/line.
;   COM15=0xD0 (official keeps RGB565 bit; no D7=D0 issue at this config).
;
; Legacy build (env:rpipico_legacy): shipped寄存器 + every-2nd-PCLK sampling.
;   Designed for 640×480 (T7 duplex fix). At 320×240 the shipped寄存器 outputs
;   640 distinct bytes/line but DMA only captures 320 (half dropped).
;
; Diagnostic 'C' command (firmware always enabled): per-HREF-line PCLK rising
; edge counter on PIO SM2. Reply: DBG1 + 0xF8 + nlines + nlines*(u32 BE
; remaining countdown). Host: edges = 0xFFFFFFFF - val -> 640 (official
; Table 3-3 timing) or 1280 (legacy shipped, each byte held 2 PCLKs) per line.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=320
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER
  -DRAW_BAYER_OFFICIAL_REGS

; COM14 V2 build: official scaling regs (DCWCTR=0x11 HDS×2, PCLK_DIV=0xF0)
; + COM14=0x18 to open the PCLK_DIV gate. Hypothesis: with the gate open the
; sensor outputs 320 distinct bytes/line (each held 2 PCLKs over 640 PCLKs)
; so every-2nd-PCLK captures the correct Bayer pattern.
; Uses every-2nd-PCLK capture (same PIO as default). Flash with:
;   pio run -e rpipico_com14v2 -t upload
[env:rpipico_com14v2]
platform = ${env:rpipico.platform}
board = ${env:rpipico.board}
framework = ${env:rpipico.framework}
monitor_speed = ${env:rpipico.monitor_speed}
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=320
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER
  -DRAW_BAYER_OFFICIAL_REGS
  -DRAW_BAYER_COM14_V2

; COM14 V2 PER-PCLK build: same registers as rpipico_com14v2 but PIO samples
; EVERY PCLK rising edge (RAW_BAYER_PER_PCLK). Decisive test for the
; single-channel-rows finding: if the sensor emits 640 distinct bytes/line,
; per-PCLK sampling recovers the full Bayer pattern (R,G,R,G...) inside each
; row instead of decimating it to one color per row.
[env:rpipico_com14v2_perpclk]
platform = ${env:rpipico.platform}
board = ${env:rpipico.board}
framework = ${env:rpipico.framework}
monitor_speed = ${env:rpipico.monitor_speed}
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=320
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER
  -DRAW_BAYER_OFFICIAL_REGS
  -DRAW_BAYER_COM14_V2
  -DRAW_BAYER_PER_PCLK

; DECISIVE TEST: official regs (COM14=0x00, DCWCTR=0x11 HDS×2) + per-PCLK
; sampling at FRAME_W=640. If DCW worked, the sensor would emit 320 distinct
; bytes/line (2 PCLK each over 640 edges) and per-PCLK would capture dup
; pairs. If DCW is bypassed, per-PCLK captures 640 distinct bytes/line
; (1 byte/PCLK) with 5 leading zeros per line - the real Bayer row.
[env:rpipico_official_perpclk_640]
platform = ${env:rpipico.platform}
board = ${env:rpipico.board}
framework = ${env:rpipico.framework}
monitor_speed = ${env:rpipico.monitor_speed}
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=640
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER
  -DRAW_BAYER_OFFICIAL_REGS
  -DRAW_BAYER_PER_PCLK

; PROCESSED BAYER QVGA: Table 2-2 Sheet 3 "30 fps QVGA Processed Bayer RGB"
; register set (CLKRC=0x01, COM7=0x15 [community-corrected: bit4 QVGA + bit2
; RGB_SELECT + bit0 RAW; Table 2-2 literally writes 0x11 = no bit2, contradicting
; Table 2-1], COM3=0x04, COM14=0x1A, XSC=0x3A, YSC=0x35, DCWCTR=0x11,
; PCLK_DIV=0xF9, PCLK_DELAY=0x02) + per-PCLK sampling at FRAME_W=320.
; A/B question: does Processed Bayer (the ONLY RAW-like mode supporting QVGA
; per Table 2-1) make the sensor emit 320 bytes/line (320 PCLK/line)?
; Add -DCOM7_LITERAL_0X11 to test the Table 2-2 literal COM7 value.
[env:rpipico_pbayer_qvga]
platform = ${env:rpipico.platform}
board = ${env:rpipico.board}
framework = ${env:rpipico.framework}
monitor_speed = ${env:rpipico.monitor_speed}
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=320
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER
  -DPROCESSED_BAYER_QVGA
  -DRAW_BAYER_PER_PCLK

; PROCESSED BAYER QVGA - COM7=0x11 LITERAL (Table 2-2): same register set as
; rpipico_pbayer_qvga but COM7 keeps the exact Table 2-2 Sheet 3 value (0x11 =
; bit4 QVGA + bit0 RAW, bit2=0), instead of the community-corrected 0x15.
; A/B result so far: 0x15 gives 320 PCLK/line but SINGLE-CHANNEL rows (no
; in-row Bayer alternation; DSP scaling destroys the pattern). Control: does
; the literal 0x11 behave differently?
[env:rpipico_pbayer_qvga_0x11]
platform = ${env:rpipico.platform}
board = ${env:rpipico.board}
framework = ${env:rpipico.framework}
monitor_speed = ${env:rpipico.monitor_speed}
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=320
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER
  -DPROCESSED_BAYER_QVGA
  -DCOM7_LITERAL_0X11
  -DRAW_BAYER_PER_PCLK

; Legacy build: shipped寄存器 + every-2nd-PCLK sampling.
; Designed for 640×480 (T7 duplex fix). At 320×240 the shipped寄存器 outputs
; 640 distinct bytes/line but DMA only captures 320 (half dropped).
; Kept for A/B comparison; default is now official + per-PCLK.
[env:rpipico_legacy]
platform = ${env:rpipico.platform}
board = ${env:rpipico.board}
framework = ${env:rpipico.framework}
monitor_speed = ${env:rpipico.monitor_speed}
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=320
  -DFRAME_H=240
  -DXCLK_PWM
  -DRAW_BAYER
