; PlatformIO Project Configuration File
; OV7670 camera on YD-RP2040 (VCC-GND) - simplest implementation
; maxgerhardt fork: 'arduino' framework = arduino-pico core (earlephilhower),
; exposes pico-sdk PIO/DMA + Wire pin remap. Required for camera capture.

[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = vccgnd_yd_rp2040
framework = arduino
monitor_speed = 115200

; Native USB CDC console on the board's USB port (GP0/GP1 free for camera).
; USB_MODE=1 + CDC_ON_BOOT=1: Serial = USB CDC, no UART pins needed.
; USE_TINYUSB: switch to the Adafruit TinyUSB stack so the device can expose a
;   composite USB webcam (UVC Video + CDC console) via Adafruit_USBD_Video.
;   The maxgerhardt builder auto-adds the TinyUSB include path when this is
;   defined (platformio-build.py configure_usb_flags).
; XCLK_PWM: GP22 driven by hardware PWM at 20.83 MHz (kept under the 24 MHz
; XCLK spec; the 25 MHz PWM build stalled the sensor FSM - see main.cpp).
build_flags =
  -DUSE_TINYUSB=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_W=320
  -DFRAME_H=240
  -DXCLK_PWM
